<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .bg-shade-50 { background-color: #f9fafb; }
        .bg-shade-100 { background-color: #f3f4f6; }
        .bg-shade-200 { background-color: #e5e7eb; }
    </style>
</head>
<body class="bg-white min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white shadow-sm py-4 px-4 border-b border-gray-100">
        <h1 class="text-xl font-semibold text-center text-gray-800">OCR Tool</h1>
    </header>

    <!-- Main Content -->
    <main class="flex-1 container mx-auto px-4 py-6 max-w-md">
        <!-- Upload Section -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Upload Image</label>
            <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center bg-shade-50 hover:bg-shade-100 transition-colors cursor-pointer" id="dropZone">
                <input type="file" id="imageInput" accept="image/*" class="hidden">
                <i class="fas fa-cloud-upload-alt text-3xl text-gray-400 mb-2"></i>
                <p class="text-gray-600">Click to upload or drag & drop</p>
                <p class="text-xs text-gray-500 mt-1">PNG, JPG, JPEG up to 10MB</p>
            </div>
        </div>

        <!-- Result Section -->
        <div class="mb-6" id="resultSection" style="display: none;">
            <label class="block text-sm font-medium text-gray-700 mb-2">Extracted Text</label>
            <div class="relative">
                <textarea 
                    id="ocrResult" 
                    class="w-full h-32 p-3 border border-gray-300 rounded-lg resize-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    readonly
                    placeholder="Text will appear here..."
                ></textarea>
                <button 
                    id="copyButton" 
                    class="absolute top-2 right-2 bg-blue-500 text-white p-1 rounded hover:bg-blue-600 transition-colors"
                    title="Copy to clipboard"
                >
                    <i class="fas fa-copy"></i>
                </button>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-3 gap-3 mb-6" id="actionButtons" style="display: none;">
            <button 
                id="shareButton" 
                class="bg-green-500 text-white py-2 px-4 rounded-lg hover:bg-green-600 transition-colors flex items-center justify-center"
            >
                <i class="fas fa-share-alt mr-2"></i> Share
            </button>
            <button 
                id="resetButton" 
                class="bg-red-500 text-white py-2 px-4 rounded-lg hover:bg-red-600 transition-colors flex items-center justify-center"
            >
                <i class="fas fa-redo mr-2"></i> Reset
            </button>
            <button 
                id="downloadButton" 
                class="bg-purple-500 text-white py-2 px-4 rounded-lg hover:bg-purple-600 transition-colors flex items-center justify-center"
            >
                <i class="fas fa-download mr-2"></i> Download
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-gray-500 text-sm">
        Made with <span class="text-red-500">❤️</span> by Sauravhhh
    </footer>

    <script>
        const imageInput = document.getElementById('imageInput');
        const dropZone = document.getElementById('dropZone');
        const ocrResult = document.getElementById('ocrResult');
        const resultSection = document.getElementById('resultSection');
        const actionButtons = document.getElementById('actionButtons');
        const copyButton = document.getElementById('copyButton');
        const shareButton = document.getElementById('shareButton');
        const resetButton = document.getElementById('resetButton');
        const downloadButton = document.getElementById('downloadButton');

        // Handle file selection
        dropZone.addEventListener('click', () => imageInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('bg-shade-100');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('bg-shade-100');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('bg-shade-100');
            
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type.startsWith('image/')) {
                handleImage(files[0]);
            }
        });

        imageInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleImage(e.target.files[0]);
            }
        });

        async function handleImage(file) {
            try {
                // Show loading state
                dropZone.innerHTML = '<div class="flex items-center justify-center"><i class="fas fa-spinner fa-spin text-2xl text-gray-400"></i></div>';
                
                // Create FormData and prepare API request
                const formData = new FormData();
                formData.append('file', file);
                formData.append('apikey', 'K85136435588957');
                formData.append('language', 'eng');
                formData.append('isOverlayRequired', 'false');

                // Send request to OCR.space API
                const response = await fetch('https://api.ocr.space/parse/image', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                // Check for successful response
                if (data.IsErroredOnProcessing) {
                    throw new Error(data.ErrorMessage || 'OCR processing failed');
                }

                // Extract text from the first result
                const text = data.ParsedResults[0]?.ParsedText || 'No text found';
                ocrResult.value = text;
                resultSection.style.display = 'block';
                actionButtons.style.display = 'grid';
                
                // Reset drop zone
                dropZone.innerHTML = `
                    <i class="fas fa-image text-3xl text-gray-400 mb-2"></i>
                    <p class="text-gray-600">Image processed successfully!</p>
                `;
            } catch (error) {
                alert(`Error processing image: ${error.message}`);
                resetTool();
            }
        }

        // Copy functionality
        copyButton.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(ocrResult.value);
                showNotification('Text copied to clipboard!');
            } catch (err) {
                ocrResult.select();
                document.execCommand('copy');
                showNotification('Text copied to clipboard!');
            }
        });

        // Share functionality
        shareButton.addEventListener('click', async () => {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'OCR Result',
                        text: ocrResult.value,
                        url: window.location.href
                    });
                } catch (err) {
                    console.log('Share cancelled');
                }
            } else {
                showNotification('Sharing not supported on this browser');
            }
        });

        // Reset functionality
        resetButton.addEventListener('click', resetTool);

        function resetTool() {
            imageInput.value = '';
            ocrResult.value = '';
            resultSection.style.display = 'none';
            actionButtons.style.display = 'none';
            dropZone.innerHTML = `
                <i class="fas fa-cloud-upload-alt text-3xl text-gray-400 mb-2"></i>
                <p class="text-gray-600">Click to upload or drag & drop</p>
                <p class="text-xs text-gray-500 mt-1">PNG, JPG, JPEG up to 10MB</p>
            `;
        }

        // Download functionality
        downloadButton.addEventListener('click', () => {
            const blob = new Blob([ocrResult.value], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ocr-result.txt';
            a.click();
            URL.revokeObjectURL(url);
        });

        // Notification system
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'fixed top-4 right-4 bg-green-500 text-white px-4 py-2 rounded-lg shadow-lg z-50 transform translate-x-full transition-transform duration-300';
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.classList.remove('translate-x-full');
            }, 100);
            
            setTimeout(() => {
                notification.classList.add('translate-x-full');
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 300);
            }, 3000);
        }
    </script>
</body>
  </html>
